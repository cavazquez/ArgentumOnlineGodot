name: Login entre Snaps publicados

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Versión común de ambos Snaps publicados
        type: string
        required: true
      server_revision:
        description: Revisión amd64 de pyao
        type: string
        required: true
      client_revision:
        description: Revisión amd64 de pyao-client
        type: string
        required: true
      server_commit:
        description: Commit completo incluido en pyao
        type: string
        required: true
      client_commit:
        description: Commit completo incluido en pyao-client
        type: string
        required: true
      server_sha256:
        description: SHA256 del Snap pyao amd64
        type: string
        required: true
      client_sha256:
        description: SHA256 del Snap pyao-client amd64
        type: string
        required: true

permissions:
  contents: read

jobs:
  login-store-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      SERVER_REVISION: ${{ inputs.server_revision }}
      CLIENT_REVISION: ${{ inputs.client_revision }}
      SERVER_COMMIT: ${{ inputs.server_commit }}
      CLIENT_COMMIT: ${{ inputs.client_commit }}
      SERVER_SHA256: ${{ inputs.server_sha256 }}
      CLIENT_SHA256: ${{ inputs.client_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cavazquez/pyao-server
          ref: ${{ env.SERVER_COMMIT }}
          path: build/fixture-tools
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: false
      - name: Instalar las dos revisiones publicadas y el entorno gráfico
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libxtst6 python3-pil pulseaudio pulseaudio-utils
          sudo snap install pyao --channel=latest/edge --revision="$SERVER_REVISION"
          sudo snap install pyao-client --channel=latest/edge --revision="$CLIENT_REVISION"
          sudo snap install mesa-2404
          sudo snap connect pyao-client:gpu-2404 mesa-2404:gpu-2404
          mkdir -p build/snap-pair-login
          snap list pyao pyao-client | tee build/snap-pair-login/installed.txt
          snap connections pyao-client | tee build/snap-pair-login/client-connections.txt
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "/run/user/$(id -u)"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=pyao_test
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Probar alta, login gráfico, movimiento, inventario y segundo login tras reiniciar
        env:
          UV_PYTHON: '3.14'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          uv sync --project build/fixture-tools --locked --no-dev
          xvfb-run -a -f "$HOME/.Xauthority" -s '-screen 0 800x600x24' uv run --project build/fixture-tools --locked --no-dev python tools/snap-pair-login.py --version "$RELEASE_VERSION" --output build/snap-pair-login --server-revision "$SERVER_REVISION" --client-revision "$CLIENT_REVISION" --server-commit "$SERVER_COMMIT" --client-commit "$CLIENT_COMMIT" --server-sha256 "$SERVER_SHA256" --client-sha256 "$CLIENT_SHA256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: snap-pair-login-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/snap-pair-login/
          retention-days: 14
