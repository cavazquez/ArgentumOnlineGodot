name: Login entre Snaps publicados

on:
  workflow_dispatch:
    inputs:
      server_revision:
        description: Revisión amd64 de pyao
        type: string
        default: '18'
        required: true
      client_revision:
        description: Revisión amd64 de pyao-client
        type: string
        default: '3'
        required: true
      server_commit:
        description: Commit completo incluido en pyao
        type: string
        default: '0a921ccd5e9a04ef5ff7dd2eb8ba8370cd2352ea'
        required: true
      client_commit:
        description: Commit completo incluido en pyao-client
        type: string
        default: 'cf1c9ab41a25db6f4290b08beb038251fac9a0b3'
        required: true
      server_sha256:
        description: SHA256 del Snap pyao amd64
        type: string
        default: 'c9b749ed07f4b193b11569ab03ef3defbcb4a525d4c209b5366249b4242000db'
        required: true
      client_sha256:
        description: SHA256 del Snap pyao-client amd64
        type: string
        default: '2c2d119da95e1395c62056fd82b8a9baa337d71c2cc79aaab6029731e9ed847a'
        required: true
  push:
    paths: ['tools/snap-pair-login.py', 'tools/snap-ui-smoke.py', '.github/workflows/snap-pair-login.yml']

permissions:
  contents: read

jobs:
  login-store-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SERVER_REVISION: ${{ inputs.server_revision || '18' }}
      CLIENT_REVISION: ${{ inputs.client_revision || '3' }}
      SERVER_COMMIT: ${{ inputs.server_commit || '0a921ccd5e9a04ef5ff7dd2eb8ba8370cd2352ea' }}
      CLIENT_COMMIT: ${{ inputs.client_commit || 'cf1c9ab41a25db6f4290b08beb038251fac9a0b3' }}
      SERVER_SHA256: ${{ inputs.server_sha256 || 'c9b749ed07f4b193b11569ab03ef3defbcb4a525d4c209b5366249b4242000db' }}
      CLIENT_SHA256: ${{ inputs.client_sha256 || '2c2d119da95e1395c62056fd82b8a9baa337d71c2cc79aaab6029731e9ed847a' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: cavazquez/pyao-server
          ref: ${{ env.SERVER_COMMIT }}
          path: build/fixture-tools
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'
          enable-cache: false
      - name: Instalar las dos revisiones publicadas y el entorno gráfico
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libxtst6 python3-pil pulseaudio pulseaudio-utils
          sudo snap install pyao --channel=latest/edge --revision="$SERVER_REVISION"
          sudo snap install pyao-client --channel=latest/edge --revision="$CLIENT_REVISION"
          sudo snap install mesa-2404
          sudo snap connect pyao-client:gpu-2404 mesa-2404:gpu-2404
          mkdir -p build/snap-pair-login
          snap list pyao pyao-client | tee build/snap-pair-login/installed.txt
          snap connections pyao-client | tee build/snap-pair-login/client-connections.txt
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "/run/user/$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=pyao_test
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Probar alta, login gráfico, movimiento, inventario y segundo login tras reiniciar
        env:
          UV_PYTHON: '3.14'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          uv sync --project build/fixture-tools --locked --no-dev
          xvfb-run -a -f "$HOME/.Xauthority" -s '-screen 0 800x600x24' uv run --project build/fixture-tools --locked --no-dev python tools/snap-pair-login.py --output build/snap-pair-login --server-revision "$SERVER_REVISION" --client-revision "$CLIENT_REVISION" --server-commit "$SERVER_COMMIT" --client-commit "$CLIENT_COMMIT" --server-sha256 "$SERVER_SHA256" --client-sha256 "$CLIENT_SHA256"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snap-pair-login-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/snap-pair-login/
          retention-days: 14
