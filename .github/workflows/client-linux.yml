name: Cliente Linux
on:
  workflow_dispatch:
    inputs:
      server_ref:
        type: string
        required: true
permissions:
  contents: read
env:
  UV_PYTHON: "3.14"
  PYTHONUTF8: "1"
concurrency:
  group: windows-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cavazquez/pyao-server
          ref: ${{ inputs.server_ref }}
          path: build/server-under-test
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.1"
          enable-cache: false
      - run: uv sync --project build/server-under-test --locked
      - name: Redis oficial en WSL propio del runner
        run: |
          wsl --set-default-version 1
          wsl --install --distribution Ubuntu-24.04 --no-launch --web-download
          wsl --set-default Ubuntu-24.04
          wsl --distribution Ubuntu-24.04 --user root --exec sh -c 'apt-get update && apt-get install -y build-essential'
          python tools/build-test-redis.py --destination "$RUNNER_TEMP/pyao-redis"
      - name: Comparar transportes sin renderizado
        run: uv run --project build/server-under-test --locked python tools/windows_redis_diagnostic.py --redis-runtime "$RUNNER_TEMP/pyao-redis" --output build/windows-redis.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-redis-diagnostic-${{ github.sha }}
          path: |
            build/windows-redis.json
            build/windows-redis.redis.log
