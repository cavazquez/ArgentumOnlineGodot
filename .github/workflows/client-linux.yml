name: Cliente Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Comprobar clasificación estricta de logs de exportación
        run: python3 -m unittest discover -s tools/tests -p test_export_log.py
      - name: Instalar OpenGL software y Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers
      - name: Instalar motor y templates del manifiesto con SHA256
        run: python3 tools/install-godot.py --destination "$RUNNER_TEMP/pyao-godot"
      - name: Importar desde checkout limpio y probar escenas y privacidad
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          tools/smoke-godot.sh 2>&1 | tee build/import-and-smoke.log
      - name: Verificar certificados TLS, cancelación y reintentos
        shell: bash
        run: |
          set -o pipefail
          python3 tools/smoke-tls.py 2>&1 | tee build/tls-smoke.log
      - name: Exportar Linux con templates de la misma versión
        run: tools/export-linux.sh
      - name: Conservar logs y ejecutable
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pyao-client-linux-${{ github.sha }}
          path: build/
          if-no-files-found: warn
          retention-days: 7

  package-snap:
    needs: import-and-export
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preparar LXD en el runner descartable
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: 5.21/stable
      - name: Instalar Snapcraft fijado
        run: |
          if snap list snapcraft >/dev/null 2>&1; then
            sudo snap refresh snapcraft --revision=19274
          else
            sudo snap install snapcraft --classic --revision=19274
          fi
      - name: Construir Snap estricto desde la fuente y el motor fijados
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          python3 tools/build-snap.py 2>&1 | tee build/snap-build.log
          sha256sum pyao-client_*_amd64.snap > build/snap-sha256.txt
      - name: Conservar paquete y procedencia
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pyao-client-snap-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            pyao-client_*_amd64.snap
            build/snap-build.log
            build/snap-sha256.txt
            snap/pyao-source.json
          if-no-files-found: warn
          retention-days: 7
