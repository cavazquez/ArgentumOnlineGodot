name: Release GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag ya existente, fusionado en main y con la misma versión en ambos repositorios
        type: string
        required: true
      build_run:
        description: ID del workflow Cliente Linux ejecutado manualmente con build_packages=true
        type: string
        required: true
      publish:
        description: Hacer pública la release tras verificar todos los archivos del borrador
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: github-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      BUILD_RUN: ${{ inputs.build_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar tag, commit fusionado y versión del servidor y cliente
        run: python3 tools/github_release.py preflight --tag "$TAG" --role client
      - name: Descargar sólo artefactos del commit exacto y de ejecuciones completas
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/jobs?per_page=100" > jobs.json
          python3 tools/github_release.py check-run --run run.json --jobs jobs.json --commit "$RELEASE_COMMIT" --workflow client-linux.yml --required quality --required import-and-export --required 'package-snap*' --required 'portable-native*' --required web-browser --required integration-world --required 'mechanics-world (classic-chat)' --required 'mechanics-world (skills)' --required 'mechanics-world (spells)' --required 'mechanics-world (navigation)' --required 'mechanics-world (duel)' --required 'mechanics-world (potions)' --required 'mechanics-world (expansion)' --required 'mechanics-world (npc-policy)' --required 'mechanics-world (economy)' --required 'mechanics-world (npcs)' --required 'mechanics-world (lifetime-stats)' --required 'mechanics-world (structure-profile)' --required 'mechanics-world (visual-sync)' --required 'mechanics-world (equipment)' --required 'mechanics-world (accessories)' --required 'mechanics-world (npc-loot)' --required 'mechanics-world (world-routes)'
          gh run download "$BUILD_RUN" --repo "$GH_REPO" --name "pyao-client-linux-$RELEASE_COMMIT" --dir incoming/native
          gh run download "$BUILD_RUN" --repo "$GH_REPO" --name "pyao-client-snap-amd64-$RELEASE_COMMIT" --dir incoming/amd64
          gh run download "$BUILD_RUN" --repo "$GH_REPO" --name "pyao-client-snap-arm64-$RELEASE_COMMIT" --dir incoming/arm64
          gh run download "$BUILD_RUN" --repo "$GH_REPO" --pattern "portable-*-$RELEASE_COMMIT" --dir incoming/portables
          gh run download "$BUILD_RUN" --repo "$GH_REPO" --name "web-$RELEASE_COMMIT" --dir incoming/portables/web
      - name: Preparar hashes y procedencia sin recompilar
        run: python3 tools/github_release.py prepare --directory incoming --output release-dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --role client
      - name: Crear o completar el borrador sin sobrescribir archivos
        run: python3 tools/github_release_upload.py stage --directory release-dist --tag "$TAG" --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --repository "$GH_REPO" --receipt release-stage.json
      - name: Publicar el borrador verificado
        if: inputs.publish
        run: python3 tools/github_release_upload.py publish --directory release-dist --tag "$TAG" --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --repository "$GH_REPO" --receipt release-publish.json
      - name: Conservar recibos de publicación
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: github-release-receipts-${{ inputs.tag }}
          path: release-*.json
          retention-days: 7
